<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Onda TV"><meta name="theme-color" content="#0a0e16"><link rel="apple-touch-icon" href="../assets/icon-180.png"><link rel="icon" type="image/svg+xml" href="../assets/icon.svg"><link rel="manifest" href="manifest.json"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Onda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Sora:wght@500;600&family=Archivo+Black&family=DM+Serif+Display&family=Big+Shoulders+Display:wght@800&display=swap" rel="stylesheet">
<style>
/* Layout: feste 1920×1080-TV-Bühne, auf jedes Display skaliert. tvOS-Tabbar oben, Live TV in drei Spalten, Filme/Serien als Regale. */
:root{
  color-scheme:dark;
  --bg:#06080d;
  --stage:#0a0e16;
  --surface:rgba(206,222,255,.07);
  --surface2:rgba(206,222,255,.13);
  --line:rgba(206,222,255,.10);
  --fg:#eef2f8;
  --dim:#98a2b6;
  --faint:#5e677a;
  --accent:#7cc4ff;
  --focus:#f4f6fa;
  --focusFg:#0a0d14;
  --live:#ff4d42;
  --gold:#ffc95a;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Display","Figtree",system-ui,sans-serif;
  --f1:"Archivo Black","Arial Black",sans-serif;
  --f2:"DM Serif Display",Georgia,serif;
  --f3:"Big Shoulders Display","Arial Narrow",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px;padding-inline:16px}
#viewport{flex:1;min-height:0;position:relative;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);transform-origin:center;background:var(--stage);border-radius:30px;overflow:hidden;font-size:28px;box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.6)}
.bgglow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(1100px 700px at 70% -10%,hsl(var(--amb) 75% 50% / .20),transparent 70%),radial-gradient(900px 500px at 15% -10%,rgba(80,140,255,.10),transparent 70%),radial-gradient(800px 600px at 100% 110%,rgba(60,200,220,.08),transparent 70%)}
.sy{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;scroll-behavior:smooth}
.sx{overflow-x:auto;overflow-y:visible;scrollbar-width:none;scroll-behavior:smooth}
.sy::-webkit-scrollbar,.sx::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){.sy,.sx{scroll-behavior:auto}.f{transition:none!important}}

/* Fokus-System */
.f{transition:transform .18s ease,background-color .18s ease,box-shadow .18s ease,color .18s ease;cursor:pointer;outline:none}
.f.focused{transform:scale(1.05);box-shadow:0 18px 44px rgba(0,0,0,.55);z-index:3;position:relative}

/* Tabbar */
.topbar{position:absolute;top:0;left:0;right:0;height:128px;display:flex;align-items:center;justify-content:space-between;gap:30px;padding:0 64px;z-index:5}
.brand{display:flex;align-items:center;gap:14px;width:300px}
.brand svg{flex:none}
.wordmark{font-family:"Sora",var(--ui);font-weight:600;font-size:38px;letter-spacing:-.03em;line-height:1;color:var(--fg)}
/* Onda Markenzeichen */
.appicon{position:relative;width:400px;max-width:100%;aspect-ratio:5/3;border-radius:34px;overflow:hidden;background:radial-gradient(120% 140% at 0% 0%,#1b3d8f 0%,#0b1430 55%,#060a18 100%);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 26px 60px rgba(0,0,0,.55);display:grid;place-items:center}
.appicon::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.16),transparent 40%);pointer-events:none}
.appicon .ai-in{display:flex;align-items:center;gap:22px;position:relative;z-index:1}
.appicon .wordmark{font-size:76px;color:#fff}
.about{display:flex;gap:40px;align-items:center;flex-wrap:wrap;padding:6px 0 10px}
.about-txt{font-size:23px;color:var(--dim);line-height:1.5}
.about-txt b{display:block;color:var(--fg);font-size:30px;font-weight:700;margin-bottom:6px}
.splash{position:absolute;inset:0;z-index:60;background:radial-gradient(70% 80% at 50% 40%,#10204a,#05070d 75%);display:grid;place-items:center;transition:opacity .6s ease}
.splash.out{opacity:0;pointer-events:none}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:26px}
.splash .wordmark{font-size:120px;color:#fff}
.splash .tag2{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#8fb4ff;font-weight:600}
.wave-anim path{stroke-dasharray:120;stroke-dashoffset:120;animation:draw 1.1s ease forwards}
.wave-anim path:nth-child(2){animation-delay:.18s}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.wave-anim path{animation:none;stroke-dashoffset:0}.splash{transition:none}}
.tabs{flex:none;display:flex;gap:4px;padding:8px;border-radius:50px;background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04));backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.05),0 0 0 1px rgba(255,255,255,.08),0 14px 40px rgba(0,0,0,.35)}
.tab{padding:12px 28px;border-radius:40px;font-size:29px;font-weight:600;color:var(--dim);white-space:nowrap}
.tab.active{color:var(--fg);background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.tab.focused{background:var(--focus);color:var(--focusFg);transform:scale(1.08);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tb-right{width:300px;display:flex;justify-content:flex-end;align-items:center;gap:20px}
.proto{font-size:19px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);border:1.5px solid rgba(255,201,90,.4);border-radius:30px;padding:6px 14px}
.clock{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}

#views{position:absolute;top:128px;left:0;right:0;bottom:0}
.view{position:absolute;inset:0;display:none}
.view.active{display:block}

/* Gemeinsame Bausteine */
.logo{--h:210;display:grid;place-items:center;width:112px;height:72px;border-radius:15px;flex:none;font-weight:800;font-size:24px;letter-spacing:.02em;color:#fff;background:linear-gradient(150deg,hsl(var(--h) 62% 46%),hsl(calc(var(--h) + 30) 70% 24%));box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.logo.lg{width:186px;height:122px;font-size:42px;border-radius:22px}
.bar{height:5px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.livebadge{display:inline-flex;align-items:center;gap:8px;font-size:18px;font-weight:800;letter-spacing:.1em;color:#fff;background:var(--live);padding:5px 12px;border-radius:8px}
.livebadge::before{content:"";width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.btns{display:flex;gap:20px;flex-wrap:wrap}
.btn{padding:18px 36px;border-radius:16px;background:var(--surface2);font-size:27px;font-weight:600;white-space:nowrap}
.btn.primary{background:rgba(124,196,255,.22)}
.btn.focused{background:var(--focus);color:var(--focusFg)}
.colhead{font-size:21px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:0 22px 14px}
.empty{color:var(--dim);font-size:26px;padding:24px 22px;line-height:1.45}
.star{color:var(--gold);margin-left:10px;font-size:.85em}
.eyebrow{font-size:20px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

/* Live TV */
.livegrid{display:grid;grid-template-columns:330px 640px 1fr;gap:36px;height:100%;padding:16px 64px 0}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.list{flex:1;min-height:0;padding:10px 14px 60px;margin:0 -14px;-webkit-mask-image:linear-gradient(transparent,#000 22px,#000 calc(100% - 70px),transparent);mask-image:linear-gradient(transparent,#000 22px,#000 calc(100% - 70px),transparent)}
.grp{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-radius:16px;font-size:28px;font-weight:600;color:var(--dim);margin-bottom:6px}
.grp .cnt{font-size:22px;color:var(--faint);font-variant-numeric:tabular-nums}
.grp.sel{color:var(--fg);background:var(--surface)}
.grp.focused{background:var(--focus);color:var(--focusFg)}
.grp.focused .cnt{color:#59627a}
.chrow{display:flex;align-items:center;gap:20px;padding:14px 20px;border-radius:18px;margin-bottom:6px}
.chrow .num{width:44px;text-align:right;font-size:24px;color:var(--faint);font-variant-numeric:tabular-nums;flex:none}
.chtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.chname{font-size:28px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chnow{font-size:22px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrow.cur{background:var(--surface)}
.chrow.focused{background:var(--focus);color:var(--focusFg);transform:scale(1.04)}
.chrow.focused .chnow,.chrow.focused .num{color:#4a536a}
.chrow.focused .bar{background:rgba(0,0,0,.12)}
.chrow.focused .bar i{background:#2a5cff}
.preview{display:flex;flex-direction:column;gap:28px;min-width:0;padding-bottom:40px}
.pv-screen{--h:210;position:relative;aspect-ratio:16/9;max-width:100%;border-radius:22px;overflow:hidden;background:hsl(var(--h) 40% 9%);box-shadow:0 0 0 1px var(--line)}
.pv-anim{position:absolute;inset:-20%;background:radial-gradient(40% 50% at 30% 40%,hsl(var(--h) 70% 45% / .55),transparent 70%),radial-gradient(45% 55% at 70% 65%,hsl(calc(var(--h) + 40) 70% 45% / .45),transparent 70%);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(6%,-5%) scale(1.1)}}
@media (prefers-reduced-motion:reduce){.pv-anim{animation:none}}
.pv-screen .livebadge{position:absolute;top:22px;left:22px}
.pv-screen .logo{position:absolute;bottom:22px;right:22px}
.pv-ch{font-size:24px;color:var(--dim);font-weight:600}
.pv-title{font-size:46px;font-weight:700;letter-spacing:-.01em;line-height:1.1;margin:6px 0 10px;text-wrap:balance}
.pv-time{font-size:24px;color:var(--dim);font-variant-numeric:tabular-nums;margin-bottom:14px}
.pv-desc{font-size:25px;line-height:1.45;color:#c6cddb;margin:18px 0 0;max-width:44ch}
.pv-next{font-size:24px;color:var(--dim);margin-top:14px}
.pv-next b{color:var(--fg);font-weight:600}

/* TV-Guide */
.epg{display:flex;flex-direction:column;height:100%;padding:8px 64px 0}
.epg-detail{display:flex;gap:30px;align-items:flex-start;height:190px;flex:none}
.epg-detail .ed-main{min-width:0;flex:1}
.ed-title{font-size:42px;font-weight:700;margin:8px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-meta{font-size:23px;color:var(--dim);font-variant-numeric:tabular-nums;display:flex;gap:14px;align-items:center}
.ed-desc{font-size:23px;color:#c6cddb;margin-top:10px;line-height:1.4;max-width:70ch}
.tag{font-size:17px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:7px;background:var(--surface2);color:var(--fg)}
.tag.live{background:var(--live)}
.tag.past{background:rgba(124,196,255,.25)}
.chips{display:flex;gap:12px;padding:10px 4px 18px;flex:none}
.chip{padding:10px 24px;border-radius:30px;background:var(--surface);font-size:23px;font-weight:600;color:var(--dim);white-space:nowrap}
.chip.sel{color:var(--fg);background:var(--surface2)}
.chip.focused{background:var(--focus);color:var(--focusFg);transform:scale(1.08)}
.epg-head{display:flex;flex:none;height:44px;border-bottom:1px solid var(--line)}
.epg-corner{width:300px;flex:none;font-size:21px;color:var(--dim);font-weight:600}
.epg-times{position:relative;flex:1}
.epg-times span{position:absolute;top:0;font-size:21px;color:var(--dim);font-variant-numeric:tabular-nums;transform:translateX(-2px)}
.epg-body{flex:1;min-height:0;padding-bottom:50px}
.egrid{position:relative}
.erow{display:flex;height:100px;border-bottom:1px solid var(--line)}
.ech{width:300px;flex:none;display:flex;align-items:center;gap:16px;font-size:23px;font-weight:600;padding-right:16px;min-width:0}
.ech span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ech .logo{width:96px;height:62px;font-size:20px;border-radius:13px}
.etrack{position:relative;flex:1}
.cell{position:absolute;top:8px;bottom:8px;border-radius:12px;background:var(--surface);padding:10px 14px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:2px}
.cell .ct{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .cm{font-size:18px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.cell.past{background:rgba(206,222,255,.035);color:var(--dim)}
.cell.live{background:rgba(124,196,255,.16)}
.cell.rem .ct::before{content:"⏰ "}
.cell.focused{transform:none;background:var(--focus);color:var(--focusFg);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.cell.focused .cm{color:#4a536a}
.nowline{position:absolute;top:0;bottom:0;width:3px;background:var(--live);z-index:2;pointer-events:none;box-shadow:0 0 12px var(--live)}
.nowline::before{content:"";position:absolute;top:-2px;left:-5px;width:13px;height:13px;border-radius:50%;background:var(--live)}

/* Filme & Serien */
.vod{height:100%;padding:8px 0 80px}
.hero{--h:30;position:relative;margin:0 64px 40px;height:380px;border-radius:28px;overflow:hidden;display:flex;align-items:flex-end;padding:44px 52px;background:linear-gradient(100deg,hsl(var(--h) 45% 12%) 30%,hsl(var(--h) 60% 30%))}
.hero::after{content:"";position:absolute;right:-6%;top:-30%;width:60%;height:160%;background:radial-gradient(closest-side,hsl(calc(var(--h) + 20) 80% 60% / .45),transparent);pointer-events:none}
.hero-in{position:relative;z-index:1;max-width:900px}
.hero h1{font-family:var(--f2);font-weight:400;font-size:86px;line-height:1;margin:10px 0 14px}
.hero p{font-size:25px;color:#d3d9e6;margin:0 0 26px;line-height:1.4;max-width:52ch}
.shelf{margin-bottom:30px}
.shelf h3{font-size:30px;font-weight:700;margin:0 64px 4px}
.shelfrow{display:flex;gap:30px;padding:22px 64px 34px}
.poster{--h:200;position:relative;flex:none;width:228px;aspect-ratio:2/3;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;background:linear-gradient(165deg,hsl(var(--h) 52% 40%),hsl(calc(var(--h) + 35) 60% 13%) 75%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.poster::before{content:"";position:absolute;width:150%;height:70%;left:-25%;top:-20%;background:radial-gradient(closest-side,hsl(calc(var(--h) - 20) 80% 70% / .35),transparent);pointer-events:none}
.poster .pt{position:relative;color:#fff;line-height:1.02;text-wrap:balance;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.pt.ff1{font-family:var(--f1);font-size:28px;text-transform:uppercase}
.pt.ff2{font-family:var(--f2);font-size:34px}
.pt.ff3{font-family:var(--f3);font-size:40px;text-transform:uppercase;letter-spacing:.01em}
.poster .py{position:relative;font-size:18px;color:rgba(255,255,255,.7);margin-top:8px;font-weight:600}
.poster .pstar{position:absolute;top:12px;right:14px;color:var(--gold);font-size:24px}
.poster .pprog{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(0,0,0,.4)}
.poster .pprog i{display:block;height:100%;background:var(--accent)}
.poster.focused{transform:scale(1.1);box-shadow:0 26px 50px rgba(0,0,0,.7),0 0 0 4px rgba(255,255,255,.9)}

/* Detail-Overlay */
.overlay{position:absolute;inset:0;z-index:20}
.detail{--h:200;position:absolute;inset:0;background:var(--stage);overflow:hidden}
.d-bg{position:absolute;inset:0;background:radial-gradient(1100px 700px at 85% 10%,hsl(var(--h) 60% 30% / .75),transparent 70%),linear-gradient(180deg,hsl(var(--h) 40% 10%),var(--stage) 70%)}
.d-body{position:relative;display:flex;gap:64px;padding:110px 96px 0}
.d-body .poster{width:330px}
.d-body .poster .pt.ff1{font-size:38px}.d-body .poster .pt.ff2{font-size:46px}.d-body .poster .pt.ff3{font-size:56px}
.d-info{flex:1;min-width:0;padding-top:10px}
.d-info h1{font-family:var(--f2);font-weight:400;font-size:84px;line-height:1;margin:12px 0 18px}
.d-meta{font-size:25px;color:var(--dim);display:flex;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.d-meta .fsk{border:1.5px solid var(--dim);border-radius:6px;padding:0 8px;font-size:21px}
.d-desc{font-size:27px;line-height:1.45;color:#d0d7e4;max-width:56ch;margin:0 0 36px}
.seasons{display:flex;gap:12px;margin:46px 96px 0;position:relative}
.eps{display:flex;gap:28px;padding:24px 96px 40px;position:relative}
.ep{flex:none;width:400px;border-radius:18px;padding:0 0 18px;background:var(--surface);overflow:hidden}
.ep-thumb{--h:200;aspect-ratio:16/9;max-width:100%;background:linear-gradient(140deg,hsl(var(--h) 50% 34%),hsl(calc(var(--h) + 40) 60% 14%));display:flex;align-items:flex-end;padding:14px 18px;font-family:var(--f3);font-size:44px;font-weight:800;color:rgba(255,255,255,.85)}
.ep-t{font-size:24px;font-weight:700;padding:14px 18px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-m{font-size:20px;color:var(--dim);padding:0 18px}
.ep.focused{background:var(--focus);color:var(--focusFg)}
.ep.focused .ep-m{color:#4a536a}


/* Trends & Top 10 */
.thero{--h:200;position:relative;margin:0 64px 34px;height:420px;border-radius:30px;overflow:hidden;display:flex;align-items:center;gap:56px;padding:0 60px;background:linear-gradient(105deg,hsl(var(--h) 40% 9%) 35%,hsl(var(--h) 55% 24%));transition:background .4s}
.thero::before{content:"";position:absolute;right:-10%;top:-40%;width:70%;height:180%;background:radial-gradient(closest-side,hsl(calc(var(--h) + 25) 80% 60% / .35),transparent);pointer-events:none}
.th-art{--h:200;position:relative;flex:none;width:220px;aspect-ratio:2/3;border-radius:16px;display:flex;align-items:flex-end;padding:18px;background:linear-gradient(165deg,hsl(var(--h) 52% 42%),hsl(calc(var(--h) + 35) 60% 13%) 75%);box-shadow:0 24px 50px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.1)}
.th-art .pt{color:#fff;line-height:1.02;word-break:break-word}
.th-txt{position:relative;min-width:0;max-width:1080px}
.th-txt h1{font-weight:400;font-size:80px;line-height:1;margin:12px 0 16px;color:#fff;text-wrap:balance}
.th-txt h1.ff1{font-family:var(--f1);text-transform:uppercase;font-size:66px}
.th-txt h1.ff2{font-family:var(--f2)}
.th-txt h1.ff3{font-family:var(--f3);font-weight:800;text-transform:uppercase;font-size:92px}
.th-meta{font-size:24px;color:#c9d2e3;display:flex;gap:18px;align-items:center}
.imdb{color:var(--gold);font-weight:700}
.th-txt p{font-size:25px;line-height:1.45;color:#d6dceb;max-width:58ch;margin:14px 0 0}
.tcard{--h:200;flex:none;width:420px;border-radius:18px;overflow:hidden;background:var(--surface)}
.tc-art{aspect-ratio:16/9;max-width:100%;display:flex;align-items:flex-end;padding:18px 22px;background:radial-gradient(70% 90% at 80% 10%,hsl(calc(var(--h) + 25) 75% 55% / .55),transparent),linear-gradient(140deg,hsl(var(--h) 50% 32%),hsl(calc(var(--h) + 40) 60% 11%))}
.tc-art .pt{color:#fff;line-height:1;hyphens:auto;-webkit-hyphens:auto;max-width:100%;overflow-wrap:anywhere}
.tc-art .pt.ff1{font-size:28px}.tc-art .pt.ff2{font-size:38px}.tc-art .pt.ff3{font-size:42px}
.tc-cap{padding:14px 20px 16px;display:flex;flex-direction:column;gap:4px}
.tc-cap b{font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-cap span{font-size:19px;color:var(--dim)}
.tcard.focused{background:var(--focus);color:var(--focusFg);transform:scale(1.07)}
.tcard.focused .tc-cap span{color:#4a536a}
.top10row{gap:6px}
.top10{flex:none;display:flex;align-items:flex-end}
.tnum{font-family:var(--f1);font-size:230px;line-height:.78;color:var(--stage);-webkit-text-stroke:4px rgba(206,222,255,.55);margin-right:-26px;position:relative;z-index:0;letter-spacing:-.04em}
.top10 .poster{z-index:1}
.top10:last-child .tnum{letter-spacing:-.1em}
.divider{display:flex;align-items:baseline;gap:22px;margin:20px 64px 6px;padding-top:30px;border-top:1px solid var(--line)}
.divider span{font-size:21px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.divider em{font-style:normal;font-size:22px;color:var(--dim)}
.srcnote{margin:10px 64px 0;font-size:19px;color:var(--faint)}
.match{margin:0 0 30px;padding:20px 26px;border-radius:18px;background:var(--surface);font-size:25px;max-width:900px}
.mt-row{display:flex;align-items:center;gap:16px}
.mt-raw{font-size:21px;color:var(--dim);margin:8px 0 0 50px}
.mt-raw code{font-family:ui-monospace,Menlo,monospace;font-size:20px;color:var(--fg);background:rgba(255,255,255,.08);padding:3px 10px;border-radius:8px}
.mi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:800;flex:none}
.match.ok .mi{background:#2fbf71;color:#04140b}
.match.none .mi{background:rgba(255,255,255,.16);color:var(--fg)}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--accent);animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.mbar{height:5px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;margin:16px 0 0 50px}
.mbar i{display:block;height:100%;width:40%;background:var(--accent);border-radius:5px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){.spin,.mbar i{animation:none}}
.d-sim{position:relative;margin-top:40px}
.d-sim h3{margin-left:96px}.d-sim .shelfrow{padding-left:96px}
.detail{overflow-y:auto;scrollbar-width:none}


.avail{position:absolute;top:12px;left:12px;z-index:2;font-size:17px;font-weight:700;padding:5px 11px;border-radius:9px;letter-spacing:.01em;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.avail.ok{background:rgba(47,191,113,.92);color:#04140b}
.avail.no{background:rgba(10,14,22,.72);color:#c3cad8}
.tc-art{position:relative}
.dim .pt,.dim .py,.tcard.dim .tc-art .pt{opacity:.55}
.tcard.dim .tc-art{filter:saturate(.45)}
.poster.dim{filter:saturate(.45)}
.poster.dim.focused,.tcard.dim.focused .tc-art{filter:none}
.hchip{font-size:19px;font-weight:700;padding:5px 12px;border-radius:9px;background:rgba(255,255,255,.12);color:#d6dceb}
.hchip.ok{background:rgba(47,191,113,.9);color:#04140b}
.hrow{display:flex;align-items:center;gap:24px}
.tfilter{font-size:20px;padding:8px 18px}
.hnote{font-style:normal;font-size:21px;font-weight:500;color:var(--dim);margin-left:14px}

.poster .pt.long{font-size:23px!important}
.d-body .poster .pt.long{font-size:32px!important}
.tc-art .pt.long{font-size:30px!important}
.th-art .pt.long{font-size:23px!important}
.poster .pt.xlong,.th-art .pt.xlong{font-size:18px!important}
.d-body .poster .pt.xlong{font-size:25px!important}

@property --amb{syntax:"<number>";inherits:true;initial-value:215}
#stage{--amb:215;transition:--amb 1.2s ease}
.qtag{position:absolute;top:12px;left:12px;z-index:2;font-size:15px;font-weight:800;letter-spacing:.06em;padding:4px 8px;border-radius:7px;background:rgba(10,14,22,.62);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.qtag.k4{background:rgba(255,255,255,.92);color:#0a0d14}
.chq{font-size:15px;font-weight:800;letter-spacing:.05em;padding:2px 7px;border-radius:6px;margin-left:10px;box-shadow:inset 0 0 0 1.5px currentColor;opacity:.7;vertical-align:3px}
/* Player: Qualität & Stream-Details */
.pi-q{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.qb{font-size:19px;font-weight:700;padding:5px 12px;border-radius:9px;background:rgba(255,255,255,.12);color:#e8edf6;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.qb.strong{background:rgba(255,255,255,.9);color:#0a0d14}
.qb.hdr{background:linear-gradient(90deg,#ffcf5a,#ff8a3d);color:#1a0d00}
.qb.warn{background:rgba(255,77,66,.92);color:#fff}
.p-osd{position:absolute;top:46px;left:60px;display:flex;gap:10px;z-index:3;opacity:0;transition:opacity .35s}
.p-osd.always{opacity:1}
.p-info:not(.hide)~.p-osd{opacity:0}
.p-stats{position:absolute;top:40px;right:40px;bottom:40px;width:660px;z-index:5;border-radius:30px;padding:36px 38px;overflow:hidden;background:linear-gradient(180deg,rgba(28,34,48,.78),rgba(14,18,28,.86));backdrop-filter:blur(34px) saturate(1.5);-webkit-backdrop-filter:blur(34px) saturate(1.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 1px rgba(255,255,255,.1),0 30px 80px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:6px}
.ps-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}
.ps-head .eyebrow{width:100%;margin-bottom:4px}
.ps-sec h5{margin:12px 0 4px;font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.sr{display:flex;justify-content:space-between;gap:20px;font-size:21px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.sr>span{color:var(--dim);white-space:nowrap}
.sr b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.sr.good b{color:#56e39f}.sr.bad b{color:#ff8a80}
.hl{color:#56e39f}
.ps-warn{margin:6px 0 0;font-size:18px;line-height:1.4;color:#ffb4ab}
.ps-hint{margin-top:auto;font-size:17px;color:var(--faint)}


/* Dropdown-Auswahl */
.picker{background:rgba(3,5,10,.5)}
.pk-box{position:absolute;right:96px;top:150px;width:760px;max-height:840px;overflow:hidden;border-radius:32px;padding:40px 36px 30px;background:linear-gradient(180deg,rgba(34,40,56,.86),rgba(16,20,30,.92));backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 0 0 1px rgba(255,255,255,.1),0 40px 100px rgba(0,0,0,.6);display:flex;flex-direction:column}
.pk-box h2{font-size:40px;margin:6px 0 22px 4px}
.pk-list{display:flex;flex-direction:column;gap:6px}
.pk-opt{display:flex;align-items:center;gap:18px;padding:18px 22px;border-radius:18px}
.pk-check{width:30px;font-size:26px;font-weight:800;color:var(--accent);flex:none;text-align:center}
.pk-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.pk-txt b{font-size:27px;font-weight:600}
.pk-txt small{font-size:20px;color:var(--dim);line-height:1.35}
.pk-opt.focused{background:var(--focus);color:var(--focusFg);transform:scale(1.03)}
.pk-opt.focused small{color:#4a536a}.pk-opt.focused .pk-check{color:#2a5cff}
.pk-foot{margin-top:22px;font-size:18px;color:var(--faint);padding-left:6px}
.chev{font-style:normal;margin-left:14px;opacity:.6;font-size:1.1em}
/* Start */
.home{padding-top:16px}
.hhero{--h:200;position:relative;margin:0 64px 40px;height:460px;border-radius:32px;overflow:hidden;display:flex;align-items:center;gap:50px;padding:0 56px;background:radial-gradient(70% 120% at 85% 20%,hsl(var(--h) 60% 26% / .9),transparent),linear-gradient(110deg,hsl(var(--h) 35% 8%) 30%,hsl(var(--h) 45% 16%));box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.hh-txt{flex:1;min-width:0}
.hh-txt h1{font-size:64px;line-height:1.05;margin:12px 0 18px;text-wrap:balance}
.hhero .th-meta .logo{width:96px;height:62px;font-size:20px}
.hh-bar{max-width:560px;margin:20px 0 10px}
.hh-next{font-size:23px;color:var(--dim);margin:0 0 26px}
.hh-screen{width:640px;flex:none;box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08)}
.soon{flex:none;width:470px;display:flex;align-items:center;gap:18px;padding:20px 22px;border-radius:20px;background:var(--surface)}
.sn-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.sn-t b{font-size:25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sn-t span{font-size:19px;color:var(--dim)}
.sn-time{color:var(--accent)!important;font-weight:700}
.sn-bell{font-size:26px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);flex:none}
.soon.focused{background:var(--focus);color:var(--focusFg)}
.soon.focused .sn-t span{color:#4a536a}.soon.focused .sn-time{color:#2a5cff!important}
.soon.focused .sn-bell{background:rgba(0,0,0,.08)}
/* Replay */
.rp{font-style:normal;color:var(--accent);margin-right:6px;font-weight:700}
.cell.focused .rp{color:#2a5cff}
.chip .rp{color:inherit;opacity:.7}
.csep{width:2px;flex:none;background:var(--line);margin:6px 10px}
.rptxt{color:var(--accent)}
#epgDays{padding-bottom:6px}
.epg-detail{height:170px}
/* Zeitversetzt */
.livebadge.ts{background:#5a6478}
.livebadge.ts::before{animation:none;border-radius:2px}
.pz{font-size:24px;font-weight:700;color:var(--fg)}


.pk-box.wide{width:900px;top:120px;max-height:880px}
.pk-list{min-height:0;flex:1;padding:4px 6px;margin:0 -6px}
.pk-txt b{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pk-rec{font-style:normal;font-size:16px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:7px;background:rgba(47,191,113,.9);color:#04140b}
.pk-q{display:inline-flex;gap:4px;margin-left:auto}
.pk-q i{width:22px;height:7px;border-radius:4px;background:rgba(255,255,255,.16)}
.pk-q i.on{background:var(--accent)}
.pk-opt.focused .pk-q i{background:rgba(0,0,0,.12)}.pk-opt.focused .pk-q i.on{background:#2a5cff}
.pk-txt small.pk-pro{color:#7fdcaa}.pk-txt small.pk-con{color:#f2a49c}
.pk-opt.focused small.pk-pro{color:#137a45}.pk-opt.focused small.pk-con{color:#a3352a}
.pk-txt{flex:1}
.pk-legend{margin-top:16px;font-size:18px;color:var(--dim);padding-left:6px}

/* Picker kompakt */
.pk-box{width:700px!important;padding:32px 28px 26px!important;top:140px!important}
.pk-box h2{font-size:36px!important;margin:4px 0 16px 4px!important}
.pk-list{gap:2px!important;padding:0!important;margin:0!important}
.pk-opt{padding:12px 18px!important;border-radius:14px!important;gap:14px!important;font-size:26px}
.pk-opt b{font-weight:600}
.pk-check{width:26px!important;font-size:24px!important}
.pk-opt.focused{transform:scale(1.02)!important}
.pk-desc{margin-top:16px;padding:16px 20px;border-radius:16px;background:rgba(255,255,255,.06);font-size:21px;line-height:1.45;display:flex;flex-direction:column;gap:2px;min-height:82px;color:var(--dim)}
.pk-desc .pk-pro{color:#7fdcaa}.pk-desc .pk-con{color:#f2a49c}
.pk-legend{margin-top:12px!important;font-size:17px!important;color:var(--faint)!important}

/* ===== Helles Erscheinungsbild ===== */
body[data-look="light"]{--bg:#cfd4dd}
#app[data-look="light"]{--stage:#e9ecf2;--surface:rgba(20,32,60,.06);--surface2:rgba(20,32,60,.10);--line:rgba(20,32,60,.12);--fg:#121826;--dim:#525c70;--faint:#8790a3;--accent:#1d64d8;--focus:#ffffff;--focusFg:#0a0d14;--gold:#c98a00}
#app[data-look="light"] #stage{box-shadow:0 0 0 1px rgba(0,0,0,.06),0 30px 80px rgba(20,30,60,.25)}
#app[data-look="light"] .bgglow{opacity:.55}
#app[data-look="light"] .tabs{background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.45));box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 1px rgba(20,32,60,.08),0 14px 40px rgba(20,30,60,.12)}
#app[data-look="light"] .tab.active{background:rgba(20,32,60,.08);box-shadow:none}
#app[data-look="light"] .tab.focused,#app[data-look="light"] .f.focused{box-shadow:0 16px 40px rgba(20,30,60,.28)}
#app[data-look="light"] .pv-desc,#app[data-look="light"] .ed-desc,#app[data-look="light"] .d-desc{color:#3a4458}
#app[data-look="light"] .d-bg{background:radial-gradient(1100px 700px at 85% 10%,hsl(var(--h) 70% 72% / .55),transparent 70%),linear-gradient(180deg,hsl(var(--h) 45% 90%),var(--stage) 70%)}
#app[data-look="light"] .tnum{-webkit-text-stroke:4px rgba(20,32,60,.35)}
#app[data-look="light"] .mt-raw code{background:rgba(20,32,60,.07)}
#app[data-look="light"] .pk-box,#app[data-look="light"] .mbox{background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(244,246,250,.96));box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(20,32,60,.08),0 40px 100px rgba(20,30,60,.3)}
#app[data-look="light"] .picker{background:rgba(220,225,235,.45)}
#app[data-look="light"] .modal{background:rgba(220,225,235,.75)}
#app[data-look="light"] .pk-opt.focused{background:#121826;color:#fff}
#app[data-look="light"] .pk-opt.focused .pk-check{color:#7cc4ff}
#app[data-look="light"] .pk-desc{background:rgba(20,32,60,.05)}
#app[data-look="light"] .pk-desc .pk-pro{color:#137a45}#app[data-look="light"] .pk-desc .pk-con{color:#b23a2c}
#app[data-look="light"] .toast{background:rgba(255,255,255,.97);color:#121826;box-shadow:0 0 0 1px rgba(20,32,60,.1),0 20px 50px rgba(20,30,60,.25)}
#app[data-look="light"] .avail.no{background:rgba(255,255,255,.8);color:#3a4458}
#app[data-look="light"] .qtag{background:rgba(255,255,255,.85);color:#121826;box-shadow:none}
#app[data-look="light"] .qtag.k4{background:#121826;color:#fff}
#app[data-look="light"] .hchip{background:rgba(255,255,255,.18)}
#app[data-look="light"] .hchip.ok{background:rgba(47,191,113,.9);color:#04140b}
#app[data-look="light"] .sinput,#app[data-look="light"] .finput{background:rgba(20,32,60,.08)}
#app[data-look="light"] .appicon{box-shadow:0 26px 60px rgba(20,30,60,.3)}
#app[data-look="light"] #remote button{background:#fff;color:#121826;box-shadow:0 0 0 1px rgba(20,32,60,.12)}
#app[data-look="light"] #remote .ok{background:#dfe6f3}
#app[data-look="light"] .rhint{color:#5c6578}
#stage{color:var(--fg)}
#app[data-look="light"] .brand .wordmark{color:var(--fg)}
#app[data-look="light"] .proto{color:#a06c00;border-color:rgba(160,108,0,.4)}
/* Bereiche, die immer dunkel bleiben (Video, Kino-Banner) */
#app[data-look="light"] #ov-player,#app[data-look="light"] .thero,#app[data-look="light"] .hhero,#app[data-look="light"] .splash{--fg:#eef2f8;--dim:#a9b2c4;--faint:#6f788b;--surface:rgba(206,222,255,.08);--surface2:rgba(206,222,255,.14);--line:rgba(206,222,255,.1);--accent:#7cc4ff;color:var(--fg)}
#app[data-look="light"] .hhero{background:radial-gradient(70% 120% at 85% 20%,hsl(var(--h) 60% 30% / .9),transparent),linear-gradient(110deg,hsl(var(--h) 35% 12%) 30%,hsl(var(--h) 45% 20%))}
#app[data-look="light"] .splash .wordmark{color:#fff}

/* Player-Menü */
.p-menu{position:absolute;right:40px;top:40px;bottom:40px;width:700px;z-index:6;border-radius:30px;padding:30px 30px 20px;display:flex;flex-direction:column;gap:18px;background:linear-gradient(180deg,rgba(28,34,48,.82),rgba(14,18,28,.9));backdrop-filter:blur(34px) saturate(1.5);-webkit-backdrop-filter:blur(34px) saturate(1.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 1px rgba(255,255,255,.1),0 30px 80px rgba(0,0,0,.55)}
.pm-tabs{display:flex;gap:8px;flex-wrap:wrap}
.pm-tabs{flex-wrap:nowrap!important;gap:6px!important}.pm-tabs .chip{font-size:19px;padding:8px 14px;white-space:nowrap}
.pm-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:2px;padding:4px 6px;margin:0 -6px}
.pm-body .pk-opt{padding:13px 18px;border-radius:14px;gap:14px;font-size:25px}
.pm-body .pk-check{width:26px;font-size:24px;color:var(--accent);text-align:center;flex:none}
.pm-body .pk-opt.focused{background:var(--focus);color:var(--focusFg);transform:scale(1.02)}
.pm-h{font-size:17px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:14px 0 4px 18px}
.pm-h:first-child{margin-top:0}
.pm-info .ps-head .eyebrow{display:none}
.pm-info .sr{font-size:20px;padding:5px 0}
.ph-gap{margin-top:18px}

/* QR-Einrichtung */
.mbox{width:1120px!important}
.qr-wrap{display:flex;gap:44px;align-items:center;margin:6px 0 4px}
.qr-box{flex:none;width:340px;height:340px;border-radius:24px;background:#fff;display:grid;place-items:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.qr-box img,.qr-box canvas{width:300px!important;height:300px!important;image-rendering:pixelated}
.qr-txt{flex:1;min-width:0}
.qr-steps{margin:0 0 20px;padding-left:34px;font-size:26px;line-height:1.55}
.qr-code{font-size:22px;color:var(--dim);margin-bottom:14px}
.qr-code b{font-family:ui-monospace,Menlo,monospace;font-size:30px;color:var(--fg);letter-spacing:.12em;margin-left:10px}
.qr-status{display:flex;align-items:center;gap:14px;font-size:23px;font-weight:600;margin-bottom:14px}
.spin.sm{width:26px;height:26px;border-width:3px}
.mi.okc{background:#2fbf71;color:#04140b;width:30px;height:30px;font-size:18px}
.qr-note{font-size:19px;color:var(--faint);line-height:1.45;margin:0}
.frow{display:flex;gap:18px}.frow .field{flex:1}
/* Senderliste bearbeiten */
.editor{background:rgba(3,5,10,.6)}
.ed-box{position:absolute;inset:60px 96px;border-radius:32px;padding:38px 44px 30px;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(30,36,50,.92),rgba(14,18,28,.95));backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 0 1px rgba(255,255,255,.08),0 40px 100px rgba(0,0,0,.55)}
.ed-head{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:22px}
.ed-head h2{font-size:42px;margin:6px 0 0}
.ed-hint{font-size:21px;color:var(--dim);text-align:right}
.ed-hint b{color:var(--accent)}
.ed-cols{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.3fr;gap:40px}
.ed-col{display:flex;flex-direction:column;min-height:0}
.ed-col .list{padding:8px 12px 40px;margin:0 -12px}
.erow2{display:flex;align-items:center;gap:18px;padding:12px 20px;border-radius:16px;margin-bottom:4px;font-size:26px}
.erow2 .logo{width:84px;height:54px;font-size:18px}
.erow2 .grip{color:var(--faint);font-size:26px;width:22px}
.erow2 .en{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.erow2 .ec{color:var(--faint);font-size:21px;font-variant-numeric:tabular-nums}
.erow2 .eye{font-size:17px;font-weight:700;letter-spacing:.04em;padding:5px 12px;border-radius:8px;background:rgba(47,191,113,.18);color:#56e39f;white-space:nowrap}
.erow2.off .eye{background:rgba(255,255,255,.08);color:var(--faint)}
.erow2.off .en,.erow2.off .logo{opacity:.45}
.erow2.sel{background:var(--surface)}
.erow2.focused{background:var(--focus);color:var(--focusFg);transform:scale(1.02)}
.erow2.focused .eye{background:rgba(19,122,69,.14);color:#137a45}.erow2.focused.off .eye{background:rgba(0,0,0,.08);color:#5a6478}

  return null;
}
function tr(raw){
  const m=raw.match(/^(\s*)([\s\S]*?)(\s*)$/),t=m[2];if(!t)return raw;

/* Abgleich: Titel normalisieren, dann exakt, Präfix oder Ähnlichkeit (Bigramme) */
function norm(x){return x.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/^\s*[a-z]{2,5}\s*[|:]\s*/,"").replace(/[\(\[](19|20)\d\d[\)\]]/g," ").replace(/\b(4k|uhd|fhd|hd|sd|hevc|h265|multi[\s-]?sub|extended cut|directors cut|imax edition|s\d\d(e\d\d)?)\b/g," ").replace(/[^a-z0-9]+/g," ").trim()}
function yearOf(x){const m=x.match(/[\(\[]((19|20)\d\d)[\)\]]/);return m?+m[1]:null}
function bigr(x){const a=[];x=x.replace(/ /g,"");for(let i=0;i<x.length-1;i++)a.push(x.slice(i,i+2));return a}
function dice(a,b){const A=bigr(a),B=bigr(b);if(!A.length||!B.length)return 0;let n=0;const C=[...B];A.forEach(g=>{const j=C.indexOf(g);if(j>-1){n++;C.splice(j,1)}});return 2*n/(A.length+B.length)}
function findInPlaylist(t){
  const pool=t.k==="m"?MOVIES:SERIES,nt=norm(t.t);let best=null,bs=0;
  pool.forEach(o=>{const no=norm(o.raw);let sc=no===nt?1:(no.startsWith(nt+" ")||nt.startsWith(no+" "))?.92:dice(no,nt);
    const y=yearOf(o.raw);if(t.k==="m"&&y&&t.y&&Math.abs(y-t.y)>1)sc-=.5;if(sc>bs){bs=sc;best=o}});
  return bs>=.86?{o:best,score:bs}:null;
}

/* ---------- Stream-Analyse (simuliert; echte App liest das aus dem Decoder) ---------- */
const ENG=["Automatisch","AVPlayer","VLC"];
function srcOf(){
  if(P.type==="live"||(P.vod&&P.vod.chId)){
    const c=chById(P.type==="live"?P.ch:P.vod.chId),r=hash(c.name+"src")%10,g=c.genre;
    if(g==="sport"&&r<3)return{w:3840,h:2160,scan:"p",fps:50,codec:"HEVC",br:24,hdr:"HLG",audio:"E-AC-3 5.1",cont:"HLS (.m3u8)",hls:true};
    if(g==="news"||r>7)return{w:1280,h:720,scan:"p",fps:50,codec:"H.264",br:6,hdr:"",audio:"AAC Stereo",cont:"MPEG-TS (.ts)",hls:false};
    if(r===5)return{w:720,h:576,scan:"i",fps:25,codec:"MPEG-2",br:4,hdr:"",audio:"MP2 Stereo",cont:"MPEG-TS (.ts)",hls:false};
    return{w:1920,h:1080,scan:"i",fps:25,codec:r%2?"HEVC":"H.264",br:r%2?9:12,hdr:"",audio:r%3?"AC-3 5.1":"AAC Stereo",cont:r%4?"MPEG-TS (.ts)":"HLS (.m3u8)",hls:!(r%4)};
  }
  const raw=P.vod.raw||"";
  if(/4K/i.test(raw))return{w:3840,h:2160,scan:"p",fps:23.976,codec:"HEVC",br:32,hdr:"HDR10",audio:"E-AC-3 5.1 Atmos",cont:"Matroska (.mkv)",hls:false};
  if(/FHD/i.test(raw))return{w:1920,h:1080,scan:"p",fps:23.976,codec:"H.264",br:10,hdr:"",audio:"AC-3 5.1",cont:"MP4 (.mp4)",hls:false};
  return{w:1920,h:1080,scan:"p",fps:P.vod.ep?25:23.976,codec:"H.264",br:8,hdr:"",audio:"AAC Stereo",cont:"Matroska (.mkv)",hls:false};
}
const dec=x=>isEN()?x:x.replace(".",",");
const fpsTxt=f=>Number.isInteger(f)?String(f):dec(f.toFixed(3));
function analyse(){
  const s=srcOf(),eSet=sv("engine"),engine=eSet===0?(s.hls?"AVPlayer":"VLC"):ENG[eSet];
  const unsupported=engine==="AVPlayer"&&!s.hls&&!/MP4/.test(s.cont);
  const dSet=sv("deint");let deint="—",outFps=s.fps,scanOut=s.scan;
  if(s.scan==="i"){
    if(engine==="AVPlayer"){deint="System (nicht einstellbar)";outFps=s.fps*2;scanOut="p"}
    else{deint=["Yadif 2x (automatisch)","Aus","Verwerfen","Überblenden","Bob","Yadif","Yadif 2x"][dSet];
      if(dSet===1){scanOut="i"}else{scanOut="p";outFps=[2,3,5].includes(dSet)?s.fps:s.fps*2}}
  }
  const match=sv("matchfps")===0;
  const hz=match?(outFps===25?50:outFps===23.976?23.976:outFps):60;
  const judder=!match&&(60%Math.round(outFps)!==0);
  const dr=s.hdr?(sv("matchdr")===0?s.hdr:"SDR (Tonemapping)"):"SDR";
  const hw=sv("hwdec")===0;
  const label=(s.h>=2160?"2160":s.h)+scanOut+fpsTxt(outFps).replace(",976","");
  return{...s,engine,unsupported,deint,outFps,scanOut,hz,judder,dr,hw,label,match};
}

  if(t==="av")body=`<div class="pm-h">Tonspur</div>${opts("audio")}<div class="pm-h">Untertitel</div>${opts("sub")}`;
  else if(t==="pic"){body=D.pic.groups.map(([lab,k])=>{const it=SETTINGS.flatMap(s=>s.items).find(i=>i.k===k);return `<div class="pm-h">${esc(lab)}</div>`+it.o.map((o,i)=>`<div class="pk-opt f" data-act="pms:${k}:${i}"><span class="pk-check">${sv(k)===i?"✓":""}</span><b>${esc(o)}</b>${it.rec===i?'<em class="pk-rec">Empfohlen</em>':""}</div>`).join("")}).join("")}
  else{ST.open=true;const pv=P.type==="live"&&P.prevCh&&P.prevCh!==P.ch?chById(P.prevCh):null;
    body=`${pv?`<div class="pm-h">Vorheriger Sender</div><div class="pk-opt f" data-act="zapm:${pv.id}"><span class="pk-check">↩</span><b>${esc(pv.name)}</b></div>`:""}<div class="pm-h">Sleep-Timer</div>${opts("sleep")}<div class="pm-h">Stream-Details</div><div class="pm-info">${statsHTML()}</div>`}
  el.innerHTML=`<div class="pm-tabs" data-sec="pmt">${tabs}</div><div class="pm-body sy" data-sec="pmb">${body}</div>`;
}
function saveVodProgress(){
  if(P.type!=="vod"||!P.vod||P.vod.mi==null)return;const m=MOVIES[P.vod.mi],f=P.pos/P.vod.dur;
  m.prog=f>.02&&f<.95?Math.round(P.pos/60):0;const pg={};MOVIES.forEach(x=>{if(x.prog)pg[x.key]=x.prog});LS.set("prog",pg);
  if(!OV.filter(x=>x!=="ov-player").length&&(S.tab==="movies"||S.tab==="home"))0;
}
/* Senderwechsel: Anzeige sofort, Stream erst nach kurzer Ruhepause (Tastenwiederholung), dann Verbindungsaufbau */
let persistT=0;function persistSoon(){clearTimeout(persistT);persistT=setTimeout(persist,1200)}
function tuneTo(id){
  id=+id;P.keepFrame=true;P.type="live";P.shift=0;P.paused=false;P.prevCh=P.ch!==id?P.ch:P.prevCh;P.ch=id;
  if(!P.list.some(c=>c.id===id))P.list=chOf("all").some(c=>c.id===id)?chOf("all"):CH.filter(c=>c.id===id);
  S.recent=[id,...S.recent.filter(x=>x!==id)].slice(0,8);persistSoon();
  updPlayer();showInfo();resetStats();startTune();
}
function zap(d){const i=P.list.findIndex(c=>c.id===P.ch);tuneTo(P.list[(Math.max(i,0)+d+P.list.length)%P.list.length].id)}
function startTune(){
  clearTimeout(P.tuneT);clearTimeout(P.spinT);P.tuning=true;P.t0=performance.now();
  $("#ov-player").classList.add("tuning");
  P.spinT=setTimeout(()=>{if(P.tuning)$("#ov-player").classList.add("slow")},500);
  P.tuneT=setTimeout(()=>{
    const a=analyse(),base=a.unsupported?0:a.engine==="AVPlayer"?1050:[520,350,1400][sv("buffer")]+(a.codec==="HEVC"?120:0);
    const hzChange=a.match&&P.curHz&&P.curHz!==a.hz;
    P.tuneT=setTimeout(()=>{
      P.tuning=false;P.keepFrame=false;$("#ov-player").classList.remove("tuning","slow");if(P.type==="live")P.hue=chById(P.ch).hue;P.curHz=a.hz;
      P.lastZap=Math.round(performance.now()-P.t0);ST.zap=P.lastZap;
      if(hzChange)toast("Fernseher wechselt auf "+fpsTxt(a.hz)+" Hz");
      {const z=$("#stZap");if(z)z.textContent=dec((ST.zap/1000).toFixed(1))+" s"}
    },base+(hzChange?1500:0)+Math.random()*120);
  },P.type==="live"?280:0);
}
function openPanel(){
  const el=$("#p-panel");
  const fix=h=>h.replaceAll('data-act="play:','data-act="zap:').replaceAll('data-fx="ch:','data-x="').replaceAll(' cur"','"');
  const rec=S.recent.filter(id=>id!==P.ch).slice(0,3).map(chById).filter(Boolean);
  el.innerHTML=`<div class="list sy">${rec.length?`<div class="colhead">${P.prevCh&&rec[0]&&rec[0].id===P.prevCh?"Vorheriger Sender · zuletzt gesehen":"Zuletzt gesehen"}</div>${fix(rec.map(chRow).join(""))}<div class="colhead ph-gap">${esc(P.list===CH?"Alle Kanäle":gName(S.group))}</div>`:`<div class="colhead">${esc(P.list===CH?"Alle Kanäle":gName(S.group))}</div>`}${fix(P.list.map(chRow).join(""))}</div>`;
  openOverlay("p-panel");$("#p-info").classList.add("hide");
  refocus(`#p-panel [data-act="zap:${P.ch}"]`);
}
function playerKey(k){
  if(P.type==="live"&&k==="right"){if(P.shift&&!P.paused){P.shift=0;updPlayer();showInfo();toast("Zurück zu Live");return}return openPMenu()}
  if(P.type==="vod"&&k==="down")return openPMenu();
  if(P.type==="live"){
    if(k==="play"){P.paused=!P.paused;updPlayer();showInfo();if(!P.paused&&P.shift>0)toast("Zeitversetzt um "+mmss(P.shift));return}
    
    if(k==="back")return closeOverlay();
    if((k==="up"||k==="down")&&sv("zap")===0)return zap(k==="up"?-1:1);
    if(k==="left")return openPanel();
    if(k==="ok"||k==="up"||k==="down"){const h=$("#p-info").classList.contains("hide");if(h)showInfo();else{$("#p-info").classList.add("hide");$("#p-num").classList.add("hide")}}
  }else{
    if(k==="back")return closeOverlay();
    if(k==="ok"||k==="play"){P.paused=!P.paused;const pp=$("#pPause");if(pp)pp.textContent=P.paused?"▶":"❚❚";showInfo();return}
    if(k==="left"||k==="right"){P.pos=Math.max(0,Math.min(P.vod.dur,P.pos+(k==="left"?-10:10)));updVodBar();showInfo();return}
    showInfo();
  }
}

/* ---------- Aktionen ---------- */
function onFx(fx,el){
  const[t,a]=fx.split(":");
  if(t==="tab"&&S.tab!==a)showTab(a);
  else if(t==="group"&&S.group!==a){S.group=a;persist();$$("#grpList .grp").forEach(g=>g.classList.toggle("sel",g===el));renderChList()}
  else if(t==="ch"&&S.previewCh!==+a){S.previewCh=+a;renderPreview()}
  else if(t==="cell")renderEpgDetail(fx.slice(5));
  else if(t==="edgs"&&S.edG!==a&&!S.moving){S.edG=a;const keep=cur.dataset.act;renderEditor();refocus(`#ov-edit [data-act="${keep}"]`)}
  else if(t==="pmt"&&P.mtab!==a){P.mtab=a;const keep=cur;renderPMenu();refocus(`#p-menu [data-act="pmt:${a}"]`)}
  else if(t==="pkd"){const[,k,i]=fx.split(":"),it=SETTINGS.flatMap(s=>s.items).find(x=>x.k===k),d=$("#pkDesc");if(d)d.innerHTML=pkDescHTML(it,+i)}
  else if(t==="mseg"&&S.mseg!==a){S.mseg=a;$$("#v-media .mseg .chip").forEach(c=>c.classList.toggle("sel",c===el));renderMBody()}
  else if(t==="hero"){const[,k,ix,pos]=fx.split(":"),h=$("#thero-"+k),tr=TREND[k][+ix];if(h&&h.dataset.ix!==ix){h.dataset.ix=ix;h.style.setProperty("--h",tr.hue);h.innerHTML=heroInner(tr,pos)}}
  else if(t==="eday"&&(S.epgDay||0)!==+a){S.epgDay=+a;if(S.epgDay!==0&&S.epgSlot==null)S.epgSlot=18;W0=epgW0();refreshEpgHead();renderEpgGrid();$("#epgBody").scrollTop=0}
  else if(t==="eslot"){const v=a==="null"?null:+a;if(S.epgSlot!==v||(v==null&&S.epgDay)){S.epgSlot=v;if(v==null)S.epgDay=0;W0=epgW0();refreshEpgHead();renderEpgGrid()}}
  else if(t==="egrp"&&S.group!==a){S.group=a;persist();$$('#epgChips [data-act^="egrp:"]').forEach(g=>g.classList.toggle("sel",g===el));renderEpgGrid();$("#epgBody").scrollTop=0}
  else if(t==="season"&&S.detail&&S.detail.season!==+a){S.detail.season=+a;const s=SERIES[S.detail.i];$$("#ov-detail .seasons .chip").forEach(g=>g.classList.toggle("sel",g===el));$("#eps").innerHTML=epsHTML(s,+a,s.seasons[a-1]);$("#eps").scrollLeft=0}
}
function activate(el){
  flushFx();
  if(!el||!el.dataset.act)return;
  const[t,...x]=el.dataset.act.split(":");
  switch(t){
    case"tab":if(el.closest("#tabs"))move("down");else{showTab(x[0]);setFocus($("#tabs .tab.active"),true)}break;
    case"group":{const f=$("#chList .chrow");if(f)setFocus(f);break}
    case"eday":case"eslot":{const c=$$("#epgBody .cell.live")[0]||$$("#epgBody .cell")[0];if(c)setFocus(c);break}
    case"edayt":{S.epgDay=(S.epgDay||0)?0:1;if(S.epgDay&&S.epgSlot==null)S.epgSlot=18;if(!S.epgDay&&S.epgSlot===18)S.epgSlot=null;W0=epgW0();refreshEpgHead();renderEpgGrid();$("#epgBody").scrollTop=0;break}
    case"egrp":{const c=$$("#epgBody .cell.live")[0];if(c)setFocus(c);break}
    case"play":openLive(x[0],chOf(S.group));break;
    case"playf":{const fl=chOf("fav");openLive(x[0],fl.length?fl:chOf("all"));break}
    case"fav":{const id=+x[0];S.favCh.has(id)?S.favCh.delete(id):S.favCh.add(id);persist();toast(S.favCh.has(id)?chById(id).name+" zu Favoriten hinzugefügt":chById(id).name+" aus Favoriten entfernt");
      if(S.group==="fav"){renderChList();const fb=$('#preview [data-act^="fav:"]');if(fb)setFocus(fb,true);else refocus("#chList .chrow")}
      else{const rows=$("#chList");const st=rows.scrollTop;rows.innerHTML=chOf(S.group).map(chRow).join("");rows.scrollTop=st;renderPreview();refocus(`#preview [data-act="fav:${id}"]`)}
      break}
    case"mseg":{const f=$("#mbody .f");if(f)setFocus(f);break}
    case"trendall":S.trendAll=!S.trendAll;renderMBody();refocus('#mbody [data-act="trendall"]');break;
    case"onlyavail":S.onlyAvail=!S.onlyAvail;persist();R[S.tab]();refocus(`#v-${S.tab} [data-act="onlyavail:${x[0]}"]`);break;
    case"trend":openTrend(x[0],+x[1]);break;
    case"watch":{const k=x[0];S.watch.has(k)?S.watch.delete(k):S.watch.add(k);persist();renderDetail();refocus('#ov-detail [data-act="watch:'+k+'"]');toast(S.watch.has(k)?"Gemerkt. Onda meldet sich, sobald der Titel in deiner Playlist auftaucht.":"Von der Merkliste entfernt");break}
    case"movie":openMovie(+x[0]);break;
    case"series":openSeries(+x[0]);break;
    case"mplay":{const m=MOVIES[+x[0]];openVod({title:m.t,sub:"Film · "+m.y+" · "+m.g,dur:m.d*60,pos:x[1]?m.prog*60:0,hue:m.hue,raw:m.raw,mi:m.i});break}
    case"eplay":{const s=SERIES[+x[0]],se=+x[1],e=+x[2];openVod({title:epTitle(s,se,e),sub:s.t+" · Staffel "+se+", Folge "+e,dur:epDur(s,se,e)*60,hue:(s.hue+e*9)%360,raw:s.raw+(s.i%3?" FHD":""),ep:true});break}
    case"vfav":{const k=x[0];S.favVod.has(k)?S.favVod.delete(k):S.favVod.add(k);persist();toast(S.favVod.has(k)?"Zu Favoriten hinzugefügt":"Aus Favoriten entfernt");renderDetail();refocus(`#ov-detail [data-act="vfav:${k}"]`);
      const act=(k[0]==="m"?"movie:":"series:")+k.slice(1);$$(`#views .poster[data-act="${act}"]`).forEach(po=>{const st=po.querySelector(".pstar");if(S.favVod.has(k)&&!st)po.insertAdjacentHTML("beforeend",'<span class="pstar">★</span>');if(!S.favVod.has(k)&&st)st.remove()});break}
    case"season":{const f=$("#eps .ep");if(f)setFocus(f);break}
    case"cell":{const key=x.join(":"),{c,p}=progByKey(key),now=Date.now();
      if(p.end<=now){toast("Diese Sendung ist bereits gelaufen");break}
      else if(p.start<=now)openLive(c.id,chOf(S.group));
      else{S.reminders.has(key)?S.reminders.delete(key):S.reminders.add(key);el.classList.toggle("rem",S.reminders.has(key));renderEpgDetail(key);toast(S.reminders.has(key)?"Erinnerung für „"+p.title+"“ um "+fmt(p.start)+" gesetzt":"Erinnerung entfernt")}
      break}
    case"editlist":openEditor();break;
    case"edg":{const id=x[0];S.hidG.has(id)?S.hidG.delete(id):S.hidG.add(id);persist();renderEditor();refocus(`#ov-edit [data-act="edg:${id}"]`);break}
    case"edc":{const id=+x[0];S.hidC.has(id)?S.hidC.delete(id):S.hidC.add(id);persist();renderEditor();refocus(`#ov-edit [data-act="edc:${id}"]`);break}
    case"edreset":S.hidG.clear();S.hidC.clear();S.gOrder=[];S.cOrder={};persist();renderEditor();refocus('#ov-edit [data-act="edreset"]');toast("Senderliste zurückgesetzt");break;
    case"pmt":{const f=$("#p-menu .pm-body .f");if(f)setFocus(f);break}
    case"pmo":{const d=pmData()[x[0]];d.set(+x[1]);renderPMenu();refocus(`#p-menu [data-act="pmo:${x[0]}:${x[1]}"]`);if(x[0]!=="sleep")toast(d.l+": "+d.o[+x[1]]);updPlayer();break}
    case"pms":{S.set[x[0]]=+x[1];persist();renderPMenu();refocus(`#p-menu [data-act="pms:${x[0]}:${x[1]}"]`);updOsd();updPlayer();break}
    case"zap":closeOverlay();tuneTo(+x[0]);break;
    case"zapm":closeOverlay();tuneTo(+x[0]);break;
    case"set":{openPicker(x[0]);break}
    case"pick":{const it=SETTINGS.flatMap(s=>s.items).find(i=>i.k===x[0]);S.set[it.k]=+x[1];persist();closeOverlay();
      const row=$(`#v-settings [data-act="set:${it.k}"]`);if(row){row.querySelector(".val").textContent=it.o[sv(it.k)];const hn=row.querySelector(".hint");if(hn)hn.textContent=hv(it)}
      if(it.k==="lang"||it.k==="theme"){applyLook(true);refocus(`#v-settings [data-act="set:${it.k}"]`)}if(it.k==="start")0;toast(it.l+": "+it.o[sv(it.k)]);break}
    case"pl":{S.playlists.forEach((p,i)=>p.active=i===+x[0]);persist();renderSettings();refocus(`[data-act="pl:${x[0]}"]`,$("#v-settings"));toast("„"+S.playlists[+x[0]].name+"“ ist jetzt aktiv (Prototyp: Testdaten bleiben gleich)");break}
    case"addpl":S.formType="qr";S.qrCode=Array.from({length:8},(_,i)=>(i===4?"-":"")+"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.random()*32|0]).join("");renderForm();openOverlay("ov-form");refocus('#ov-form [data-act="qrsim"]');break;
    case"qrsim":{const st=$("#qrStatus");if(!st)break;st.innerHTML='<span class="spin sm"></span><span>iPhone verbunden · Daten werden empfangen …</span>';
      setTimeout(()=>{if(!OV.includes("ov-form"))return;const st2=$("#qrStatus");if(st2)st2.innerHTML='<span class="mi okc">✓</span><span>Empfangen: „Wohnzimmer“ · Xtream Codes</span>';
        setTimeout(()=>{if(!OV.includes("ov-form"))return;S.playlists.push({name:"Wohnzimmer",type:"Xtream Codes",info:"per iPhone eingerichtet",active:false,ua:""});persist();closeOverlay();renderSettings();refocus('[data-act="addpl"]',$("#v-settings"));toast("Playlist „Wohnzimmer“ angelegt")},900)},1100);break}
    case"seg":S.formType=x[0];renderForm();refocus(`#ov-form [data-act="seg:${x[0]}"]`);break;
    case"savepl":{const name=($("#fName").value||"").trim()||"Neue Playlist";const ua=(($("#fUa")||{}).value||"").trim();S.playlists.push({name,type:S.formType==="xtream"?"Xtream Codes":"M3U-URL",info:ua?"User-Agent: "+ua:"nicht geladen",active:false,ua});persist();closeOverlay();renderSettings();refocus('[data-act="addpl"]',$("#v-settings"));toast("Playlist „"+name+"“ angelegt");break}
    case"close":if(OV[OV.length-1]==="ov-edit")closeEditor();else closeOverlay();break;
    case"q":S.query=x[0];$("#q").value=x[0];renderSResults();break;
  }
}

/* ---------- Eingabe ---------- */
function press(k){
  if($("#splash"))return;
  const top=OV[OV.length-1];
  if(top==="ov-player")return playerKey(k);
  if(top==="ov-edit")return editorKey(k);
  if(top==="p-menu"){if(k==="back"){ST.open=false;closeOverlay();return showInfo()}if(k==="ok")return activate(cur);if(["up","down","left","right"].includes(k))return move(k);return}
  if(top==="p-panel"){if(k==="back"||k==="right"){closeOverlay();return showInfo()}if(k==="ok")return activate(cur);if(k==="up"||k==="down")return move(k);return}
  if(top==="ov-detail"&&k==="back"&&S.dstack.length){S.detail=S.dstack.pop();renderDetail();refocus("#ov-detail .btn");return}
  if(top==="ov-detail"&&k==="back")S.dstack=[];
  if(k==="ok"||k==="play")return activate(cur);
  if(k==="back")return goBack();
  if(!["up","down","left","right"].includes(k))return;
  move(k);
}
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const map={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",Enter:"ok"," ":"ok",Escape:"back",Backspace:"back",MediaPlayPause:"play",p:"play"};
  const k=map[e.key],inInput=document.activeElement&&document.activeElement.tagName==="INPUT";
  if(inInput){
    if(e.key==="ArrowUp"||e.key==="ArrowDown"||e.key==="Escape"||e.key==="Enter"){e.preventDefault();if(e.key==="Escape"){document.activeElement.blur();press("back")}else press(e.key==="ArrowUp"?"up":"down")}
    return;
  }
  if(!k)return;e.preventDefault();press(k);
});
stage.addEventListener("click",e=>{
  const el=e.target.closest(".f");if(!el)return;
  if(OV[OV.length-1]==="ov-player"&&!el.closest("#p-panel")&&!el.closest("#p-menu"))return;
  const inScope=roots().some(r=>r.contains(el));if(!inScope)return;
  if(el.tagName==="INPUT"){setFocus(el);return}
  if(el.dataset.tap==="focus"&&el!==cur){setFocus(el);return}
  if(el.closest("#tabs")){setFocus(el);return}
  setFocus(el,el.dataset.fx&&el.dataset.fx.startsWith("ch:"));activate(el);
});
$("#ov-player").addEventListener("click",e=>{if(e.target.closest("#p-panel")||e.target.closest("#p-menu"))return;if(OV[OV.length-1]==="ov-player")press("ok")});
$$("#remote button").forEach(b=>{b.addEventListener("pointerdown",e=>e.preventDefault());b.addEventListener("click",()=>press(b.dataset.k))});

/* ---------- Start ---------- */
fit();clock();setInterval(clock,15000);
applyLook(false);
renderTabs();
S.mseg=sv("start")===4?"fav":"m";showTab(["home","live","epg","media","media"][sv("start")]||"home");
setFocus($("#tabs .tab.active"),true);
requestAnimationFrame(fit);trNode(document.getElementById("app"));
setTimeout(()=>{const sp=$("#splash");sp.classList.add("out");setTimeout(()=>sp.remove(),700)},1900);
})();
</script>
